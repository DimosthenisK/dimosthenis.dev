# Copy to .github/workflows/deploy.yml in the app repo.
# Replace STACK_NAME with the homeserver compose project name (folder under stacks/).
#
# Required repo secrets:
#   DEPLOY_WEBHOOK_TOKEN — homeserver compose pull
#   CLOUDFLARE_API_TOKEN — Cloudflare Pages Edit (public origin; survives home WAN)
#   CLOUDFLARE_ACCOUNT_ID — 2585a0ec0c762c13c15c3d640167ed1a
#
# Permissions: packages:write (GHCR). GITHUB_TOKEN is enough for same-repo packages.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Homeserver docker compose project name (stacks/<STACK_NAME>/)
  STACK_NAME: dimosthenis-dev
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${{ github.repository_owner }}"
          pkg="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${pkg}/visibility" \
            -f visibility=public \
            || gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${pkg}/visibility" \
              -f visibility=public \
            || true

      - name: Trigger homeserver deploy webhook
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          test -n "$DEPLOY_WEBHOOK_TOKEN"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            "https://deploy.dimosthenis.dev/deploy/${STACK_NAME}"

  pages:
    name: Cloudflare Pages (public origin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Skipping Pages (set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets)"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy build \
            --project-name dimosthenis-dev \
            --commit-dirty=true

